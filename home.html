<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEUS - Odd/Even UTR Prediction Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navigation Bar -->
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-xl shadow-lg shadow-amber-500/10">
          ⚡
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wider text-amber-400">ZEUS</h1>
          <p class="text-xs text-slate-400">UTR Prediction Simulator</p>
        </div>
      </div>
      
      <!-- Wallet Display -->
      <div class="flex items-center gap-4">
        <div class="bg-slate-800/80 px-4 py-1.5 rounded-lg border border-slate-700 text-right">
          <span class="text-xs text-slate-400 block">Wallet Balance</span>
          <span id="userBalance" class="text-emerald-400 font-bold text-lg">₹10,000</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-1 flex flex-col gap-6 my-4">
    
    <!-- Profile Stats Banner -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-slate-400 text-xs">Profile Name</p>
        <p class="text-amber-400 font-bold text-xl">ZEUS</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-slate-400 text-xs">Total Net Profit (after 10% Tax)</p>
        <p id="totalProfit" class="text-emerald-400 font-bold text-xl">₹0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-slate-400 text-xs">Total Loss</p>
        <p id="totalLoss" class="text-rose-400 font-bold text-xl">₹0</p>
      </div>
    </div>

    <!-- Prediction Game Box -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-dice text-amber-400"></i> Place Prediction
      </h2>

      <!-- Step 1: Select Odd or Even -->
      <div class="mb-6">
        <label class="text-sm font-semibold text-slate-400 block mb-2">1. Select Prediction</label>
        <div class="grid grid-cols-2 gap-4">
          <button id="btnOdd" onclick="selectPrediction('ODD')" class="py-4 rounded-xl font-bold border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-slate-300 text-lg transition">
            ODD (1, 3, 5, 7, 9)
          </button>
          <button id="btnEven" onclick="selectPrediction('EVEN')" class="py-4 rounded-xl font-bold border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-slate-300 text-lg transition">
            EVEN (0, 2, 4, 6, 8)
          </button>
        </div>
      </div>

      <!-- Step 2: Select Stake Amount -->
      <div class="mb-6">
        <label class="text-sm font-semibold text-slate-400 block mb-2">2. Select Stake Amount (₹)</label>
        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2" id="stakeButtons">
          <!-- Dynamically filled JS buttons -->
        </div>
      </div>

      <!-- Pay & Submit Button -->
      <button id="submitBtn" onclick="submitPrediction()" class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-lg transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
        <i class="fa-solid fa-lock"></i> Pay & Submit Prediction
      </button>
    </div>

  </main>

  <script>
    let currentPrediction = null;
    let currentStake = null;
    const stakes = [100, 200, 300, 400, 500, 600, 700, 800, 900];

    const stakeContainer = document.getElementById('stakeButtons');
    stakes.forEach(amt => {
      const btn = document.createElement('button');
      btn.innerText = `₹${amt}`;
      btn.className = `py-2 rounded-lg font-semibold border border-slate-700 bg-slate-800/50 text-slate-300 hover:bg-slate-800 transition stake-btn-${amt}`;
      btn.onclick = () => selectStake(amt);
      stakeContainer.appendChild(btn);
    });

    function selectPrediction(type) {
      currentPrediction = type;
      document.getElementById('btnOdd').className = type === 'ODD' 
        ? 'py-4 rounded-xl font-bold border-2 border-amber-400 bg-amber-500/10 text-amber-400 text-lg'
        : 'py-4 rounded-xl font-bold border border-slate-700 bg-slate-800/50 text-slate-300 text-lg';
      
      document.getElementById('btnEven').className = type === 'EVEN' 
        ? 'py-4 rounded-xl font-bold border-2 border-amber-400 bg-amber-500/10 text-amber-400 text-lg'
        : 'py-4 rounded-xl font-bold border border-slate-700 bg-slate-800/50 text-slate-300 text-lg';
    }

    function selectStake(amt) {
      currentStake = amt;
      stakes.forEach(s => {
        const b = document.querySelector(`.stake-btn-${s}`);
        if(b) b.className = s === amt 
          ? `py-2 rounded-lg font-semibold border-2 border-amber-400 bg-amber-500/10 text-amber-400 stake-btn-${s}`
          : `py-2 rounded-lg font-semibold border border-slate-700 bg-slate-800/50 text-slate-300 hover:bg-slate-800 stake-btn-${s}`;
      });
    }

    async function loadProfile() {
      const res = await fetch('/api/user/profile');
      const user = await res.json();
      document.getElementById('userBalance').innerText = `₹${user.balance.toLocaleString()}`;
      document.getElementById('totalProfit').innerText = `₹${user.total_profit.toLocaleString()}`;
      document.getElementById('totalLoss').innerText = `₹${user.total_loss.toLocaleString()}`;
    }

    async function submitPrediction() {
      if (!currentPrediction || !currentStake) {
        alert('Please select both Prediction (Odd/Even) and Stake Amount!');
        return;
      }

      try {
        const res = await fetch('/api/predict/initiate-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prediction: currentPrediction, stake: currentStake })
        });

        const data = await res.json();

        if (data.success && data.payUrl) {
          // Redirect user directly to tailPay cashier checkout page
          window.location.href = data.payUrl;
        } else {
          alert('Error creating payment: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        console.error("Payment submission error:", err);
        alert('Network error connecting to payment gateway.');
      }
    }

    loadProfile();
  </script>
</body>
</html>
